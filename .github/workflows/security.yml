# =============================================================================
# Security — NearSea
# Gate keamanan supply-chain: secret scanning + dependency review + audit
# dependensi. Aturan: docs/development/secrets-and-gitignore.md
# Register requirement: docs/security/security-requirements.md (SEC-CICD-001/002).
#
# Semua action pihak ketiga di-pin ke commit SHA (cicd-security.md §5).
# =============================================================================

name: Security

on:
  pull_request:
    branches: [dev, testnet, mainnet]
  push:
    branches: [dev, testnet, mainnet]
  schedule:
    # Audit berkala (tiap Senin 03:00 UTC) untuk menangkap CVE baru.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action membaca daftar commit PR lewat API; tanpa scope ini GitHub
    # menjawab 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (cargo + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # `--locked` memakai Cargo.lock milik cargo-audit sendiri; tanpa itu cargo
      # menarik dependency terbaru yang bisa menuntut rustc lebih baru daripada
      # toolchain ter-pin, dan langkah ini gagal karena alasan yang tidak ada
      # hubungannya dengan proyek.
      - name: cargo audit (CVE dependency)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: npm audit (high+)
        working-directory: frontend
        # Advisory tanpa patch dicatat di `frontend/pnpm-workspace.yaml`
        # (auditConfig.ignoreCves) supaya terlihat saat review — bukan
        # disenyapkan otomatis. Advisory BARU yang bisa diperbaiki = CI merah.
        run: pnpm audit --audit-level=high

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Dependency review membandingkan manifest PR dengan branch target. Selama
      # branch target belum punya manifest apa pun, GitHub belum membentuk graph
      # dan API-nya menjawab 403/404 — kegagalan struktural, bukan temuan
      # keamanan. Gate ini aktif sendiri begitu baseline-nya ada.
      - name: Cek baseline dependency graph
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base='${{ github.base_ref }}'
          head='${{ github.head_ref }}'
          if gh api "repos/${{ github.repository }}/dependency-graph/compare/${base}...${head}" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Dependency review dilewati"
              echo "Branch target \`$base\` belum punya dependency graph (belum ada manifest)."
              echo "Gate ini aktif otomatis setelah baseline manifest ada di branch target."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        if: steps.baseline.outputs.available == 'true'
        with:
          fail-on-severity: high
