# =============================================================================
# Security — NearSea
# Gate keamanan supply-chain: secret scanning + dependency review + audit
# dependensi. Aturan: docs/development/secrets-and-gitignore.md
# Register requirement: docs/security/security-requirements.md (SEC-CICD-001/002).
#
# Semua action pihak ketiga di-pin ke commit SHA (cicd-security.md §5).
# =============================================================================

name: Security

on:
  pull_request:
    branches: [dev, testnet, mainnet]
  push:
    branches: [dev, testnet, mainnet]
  schedule:
    # Audit berkala (tiap Senin 03:00 UTC) untuk menangkap CVE baru.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (cargo + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `cargo audit` membaca Cargo.lock di root workspace (SEC-CICD-001).
      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: npm audit (high+)
        working-directory: frontend
        run: pnpm audit --audit-level=high

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
