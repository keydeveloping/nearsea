# =============================================================================
# CI — NearSea
# Gate: fmt/clippy/test + build wasm (kontrak) dan lint/typecheck/test/build (FE).
# Aturan & gate lengkap: docs/development/ci-cd.md
# Keamanan pipeline:    docs/security/cicd-security.md
#
# Semua action pihak ketiga di-pin ke commit SHA (cicd-security.md §5).
# Versi toolchain mengikuti rust-toolchain.toml / .nvmrc agar build lokal = CI.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [dev, testnet, mainnet]
  push:
    branches: [dev, testnet, mainnet]

# Batalkan run lama saat ada push baru ke branch yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Kontrak (Rust) ---------------------------------------------------------
  contracts:
    name: Contracts — fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Versi toolchain TIDAK ditulis di sini — dibaca dari rust-toolchain.toml (SSOT pin).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + sandbox tests (near-workspaces)
        run: cargo test --workspace

      # cargo-near dipasang dari rilis resmi dengan versi + hash ter-pin
      # (bukan `cargo install` tanpa pin — cicd-security.md §3).
      - name: Install cargo-near (pinned)
        env:
          CARGO_NEAR_VERSION: 0.22.0
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          set -euo pipefail
          archive="cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/${archive}"
          echo "${CARGO_NEAR_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive"
          install -m 0755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
          cargo near --version

      # Build wasm + ABI diaktifkan (TASK-032, ci-cd.md §14). Gate ini membuktikan
      # wasm ter-build dan ABI-nya sah; build REPRODUCIBLE (NEP-330, image Docker
      # ter-pin) berjalan di release.yml saat tag rilis dibuat.
      - name: Build wasm + ABI
        run: |
          for crate in contract market factory; do
            cargo near build non-reproducible-wasm --manifest-path "$crate/Cargo.toml"
          done

      # Versi artefak harus tertanam di wasm dan bisa dibaca dari luar (NEP-330,
      # SEC-CONTRACT-006). Diperiksa tiap PR agar metadata tidak pernah basi.
      - name: Verify embedded NEP-330 metadata (version + link)
        run: |
          set -euo pipefail
          failed=0
          for crate in contract market factory; do
            pkg=$(awk -F'"' '/^\[package\]/{p=1} p && /^name[[:space:]]*=/{print $2; exit}' "$crate/Cargo.toml")
            expected=$(awk -F'"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' "$crate/Cargo.toml")
            wasm="target/near/${pkg//-/_}/${pkg//-/_}.wasm"

            if [ ! -f "$wasm" ]; then
              echo "FAIL $wasm tidak ada"; failed=1; continue
            fi
            meta=$(grep -a -o -E '\{"version":"[^"]+","link":(null|"[^"]+"),' "$wasm" | head -n1 || true)
            if [ -z "$meta" ]; then
              echo "FAIL $crate: contract_source_metadata tidak tertanam"; failed=1; continue
            fi
            got=$(printf '%s' "$meta" | sed -E 's/^\{"version":"([^"]+)".*/\1/')
            link=$(printf '%s' "$meta" | sed -E 's/^.*"link":([^,]+),$/\1/')
            echo "$crate: version=$got link=$link"
            [ "$got" = "$expected" ] || { echo "FAIL $crate: versi '$got' != manifest '$expected'"; failed=1; }
            [ "$link" != "null" ] || { echo "FAIL $crate: link NEP-330 kosong (package.repository)"; failed=1; }
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Metadata NEP-330 ketiga crate terverifikasi."

      - name: Record wasm code hash (sha256)
        run: |
          mkdir -p artifacts
          sha256sum target/near/*/*.wasm | tee artifacts/code-hash.txt

      - name: Upload contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-wasm
          retention-days: 90
          path: |
            target/near/*/*.wasm
            artifacts/code-hash.txt

  # --- Frontend (Next.js) -----------------------------------------------------
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Versi pnpm dibaca dari `packageManager` di frontend/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Format check (Prettier)
        working-directory: frontend
        run: pnpm format:check

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Test (Vitest)
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          # Build TIDAK butuh secret produksi (FACT) — hanya nilai publik.
          NEXT_PUBLIC_NEAR_NETWORK: testnet
