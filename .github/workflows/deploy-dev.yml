# =============================================================================
# Deploy — DEV (branch `dev`, staging)
# BELUM mengirim apa pun: environment dev (VPS + subdomain) belum di-provision
# (TASK-028) dan wiring SSH belum dikonfigurasi (TASK-029). Workflow sengaja
# manual-only sampai itu selesai — tidak ada kredensial yang dibutuhkan.
# Aturan branch & promosi: docs/development/git-workflow.md
# Pipeline & environment: docs/development/ci-cd.md §1/§15
# =============================================================================

name: Deploy (dev)

on:
  # Manual saja sampai TASK-029 menambahkan trigger `push: branches: [dev]`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging (dev)
    runs-on: ubuntu-latest
    # Environment GitHub "dev" — tidak butuh approval.
    environment:
      name: dev
      url: ${{ vars.DEV_APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cek prasyarat environment (TASK-028/029)
        run: |
          missing=""
          for name in DEV_HOST DEV_SSH_USER DEV_APP_DIR DEV_APP_URL; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Environment dev belum di-provision — variabel kosong:$missing"
            echo "Selesaikan TASK-028 (VPS + Docker Compose) dan TASK-029 (wiring deploy) dulu."
            exit 1
          fi
        env:
          DEV_HOST: ${{ vars.DEV_HOST }}
          DEV_SSH_USER: ${{ vars.DEV_SSH_USER }}
          DEV_APP_DIR: ${{ vars.DEV_APP_DIR }}
          DEV_APP_URL: ${{ vars.DEV_APP_URL }}

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEV_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH (docker compose pull/up)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.DEV_SSH_USER }}@${{ vars.DEV_HOST }}" \
            "cd ${{ vars.DEV_APP_DIR }} && docker compose pull && docker compose up -d"

      - name: Smoke test
        run: |
          curl -fsS "${{ vars.DEV_APP_URL }}/api/health" || exit 1
