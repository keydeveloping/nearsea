# =============================================================================
# Deploy — TESTNET (branch `testnet`)
# BELUM mengirim apa pun: environment testnet (VPS + subdomain) belum
# di-provision (TASK-028) dan wiring SSH belum dikonfigurasi (TASK-029).
# Deploy kontrak testnet TIDAK mengubah mainnet, tapi tetap ter-gate environment
# (approval 1 orang) agar tidak tak sengaja menimpa rilis testnet.
# Aturan branch & promosi: docs/development/git-workflow.md §3
# =============================================================================

name: Deploy (testnet)

on:
  # Manual saja sampai TASK-029 menambahkan trigger `push: branches: [testnet]`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy testnet
    runs-on: ubuntu-latest
    environment:
      name: testnet
      url: ${{ vars.TESTNET_APP_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cek prasyarat environment (TASK-028/029)
        run: |
          missing=""
          for name in TESTNET_HOST TESTNET_SSH_USER TESTNET_APP_DIR TESTNET_APP_URL; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Environment testnet belum di-provision — variabel kosong:$missing"
            echo "Selesaikan TASK-028 (VPS + Docker Compose) dan TASK-029 (wiring deploy) dulu."
            exit 1
          fi
        env:
          TESTNET_HOST: ${{ vars.TESTNET_HOST }}
          TESTNET_SSH_USER: ${{ vars.TESTNET_SSH_USER }}
          TESTNET_APP_DIR: ${{ vars.TESTNET_APP_DIR }}
          TESTNET_APP_URL: ${{ vars.TESTNET_APP_URL }}

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.TESTNET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.TESTNET_SSH_USER }}@${{ vars.TESTNET_HOST }}" \
            "cd ${{ vars.TESTNET_APP_DIR }} && docker compose pull && docker compose up -d"

      - name: Verify contract code hash (SEC-CONTRACT-006)
        run: |
          # Bandingkan hash artifact CI dengan contract_source_metadata on-chain.
          # Diaktifkan bersama build reproducible + NEP-330 (TASK-032, ci-cd.md §14).
          echo "PROPOSED (TASK-032): near view <contract> contract_source_metadata | verify hash"

      - name: Smoke test
        run: |
          curl -fsS "${{ vars.TESTNET_APP_URL }}/api/health" || exit 1
